[project]
name = "influxdb-sample"
version = "0.1.0"
description = "CPU sampler writing to InfluxDB and HTTP reader service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "influxdb-client>=1.50.0",
    "psutil>=7.2.2",
    "uvicorn>=0.48.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/influx_cpu_monitor"]
